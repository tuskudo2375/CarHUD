name: Build and publish MapsBridge v1.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android 35 build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build both APKs
        run: gradle --no-daemon :companion:assembleDebug :headunit:assembleDebug

      - name: Prepare release APKs
        run: |
          mkdir -p output
          cp companion/build/outputs/apk/debug/companion-debug.apk output/MapsBridge-Chinh.apk
          cp headunit/build/outputs/apk/debug/headunit-debug.apk output/MapsBridge-Phu.apk
          stat -c '%n %s bytes' output/*.apk

      - name: Publish public release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0
          target_commitish: ${{ github.sha }}
          name: MapsBridge v1.0
          body: |
            Biến điện thoại Android cũ (Android 8.0 trở lên) thành màn hình dẫn đường Google Maps và hiển thị thông báo chuyên dụng cho xe máy/ô tô.

            - **Một chạm là đi:** chia sẻ địa điểm từ Máy Chính; Máy Phụ nhận qua Bluetooth, tự bật màn hình và mở Google Maps dẫn đường xe máy.
            - **Thông báo hữu ích:** xem thông báo và thao tác gốc tương thích ngay trên Máy Phụ.
            - **Không cần SIM 4G riêng ở Máy Phụ:** Google Maps có thể dùng Wi‑Fi/điểm phát sóng hoặc bản đồ ngoại tuyến đã tải.
            - Launcher Máy Phụ có dock tùy chỉnh, ngăn ứng dụng, hình nền riêng và lịch dương/âm; màn hình được phép ngủ khi chờ.

            **Tương thích:** cả APK Chính và Phụ yêu cầu Android 8.0 Oreo trở lên (API 26). APK universal, không giới hạn ABI.
          draft: false
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: true
          preserve_order: true
          files: |
            output/MapsBridge-Chinh.apk
            output/MapsBridge-Phu.apk
