name: Build MapsBridge APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android 35 build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APKs
        run: gradle --no-daemon :companion:assembleDebug :headunit:assembleDebug

      - name: Prepare APK downloads
        run: |
          mkdir -p output
          cp companion/build/outputs/apk/debug/companion-debug.apk output/MapsBridge-Chinh.apk
          cp headunit/build/outputs/apk/debug/headunit-debug.apk output/MapsBridge-Phu.apk

      - name: Report APK file sizes
        run: stat -c '%n %s bytes' output/*.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MapsBridge-APKs
          path: output/*.apk
          if-no-files-found: error
          retention-days: 14
- name: Sign APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
