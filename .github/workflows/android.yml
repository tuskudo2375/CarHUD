name: Build Android APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Install Android 34 build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APKs
        run: gradle --no-daemon :companion:assembleDebug :headunit:assembleDebug

      - name: Prepare APK downloads
        run: |
          mkdir -p output
          cp companion/build/outputs/apk/debug/companion-debug.apk output/CarHUD-Companion.apk
          cp headunit/build/outputs/apk/debug/headunit-debug.apk output/CarHUD-HeadUnit.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: CarHUD-APKs
          path: output/*.apk
          if-no-files-found: error
          retention-days: 14

